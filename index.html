<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UDUF Africa — Executive Certificate Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;800&family=Lora:ital,wght@1,400..700&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --blue-dark:  #0D1B6E;
    --orange-primary: #F07C1A;
    --orange-glow: rgba(240, 124, 26, 0.2);
    --bg: #F8F9FC;
    --surface: #FFFFFF;
    --text: #0D1B6E;
    --border: #E2E8F0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

  header {
    background: var(--blue-dark);
    padding: 0 40px; height: 72px;
    display: flex; align-items: center; gap: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: white; }
  header h1 span { color: var(--orange-primary); }

  main { max-width: 850px; margin: 0 auto; padding: 40px 20px; }

  .card {
    background: var(--surface);
    border-radius: 20px; padding: 35px;
    box-shadow: 0 10px 40px rgba(13,27,110,0.08);
    border: 1px solid var(--border);
  }

  .section-title { margin-bottom: 25px; text-align: center; }
  .section-title h2 { font-family: 'Playfair Display', serif; color: var(--blue-dark); font-size: 1.8rem; }

  .field-group { margin-bottom: 20px; }
  label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: var(--blue-dark); }
  
  select, input {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: #FDFDFD;
    font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s;
  }
  select:focus, input:focus { border-color: var(--orange-primary); box-shadow: 0 0 0 4px var(--orange-glow); }
  input:read-only { background: #f1f3f7; cursor: not-allowed; color: #666; }

  .toggle-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--orange-primary); }
  input:checked + .slider:before { transform: translateX(22px); }

  .btn-generate {
    width: 100%; padding: 18px; background: var(--blue-dark); color: white;
    border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
    margin-top: 20px; font-size: 1rem;
  }

  /* ── CERTIFICATE ENGINE ── */
  #cert-wrapper { position: absolute; left: -9999px; top: 0; }
  #cert-capture { width: 1000px; height: 780px; position: relative; background: white; overflow: hidden; }
  .bg-img { width: 100%; height: 100%; position: absolute; z-index: 1; }
  
  .render-text { 
    position: absolute; z-index: 5; text-align: center; 
    display: flex; justify-content: center; align-items: center;
    color: #1a237e; 
  }

  /* COORDINATES UPDATED: Name & Office raised higher */
  #r-name { 
    top: 265px; left: 50px; width: 900px; height: 70px;
    font-family: 'Lora', serif; font-weight: 1000; font-size: 42px; 
    text-transform: uppercase; font-style: italic;
  }
  #r-office { 
    top: 345px; left: 100px; width: 800px; 
    font-weight: 800; font-size: 42px; 
    color: #2F5FE8; text-transform: uppercase;
  }
  #r-id { 
    bottom: 12px; left: 0; width: 100%;
    font-family: monospace; font-size: 19px; font-weight: bold; 
    color: #0D1B6E;
  }
  
  /* Signatures (UNTOUCHED) */
  .sig-img { position: absolute; z-index: 10; height: 75px; width: auto; object-fit: contain; }
  #sig-sec { bottom: 110px; left: 45px; }
  #sig-founder { bottom: 110px; right: 130px; }

  #preview-section { display: none; margin-top: 30px; text-align: center; }
  #preview-section img { width: 100%; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <h1>UDUF Africa<span> Executive Certificate Portal</span></h1>
</header>

<main>
  <div class="card">
    <div class="section-title">
      <h2>Executive Certificate Portal</h2>
      <p style="color: #666;">Confirm details below to generate your official certificate.</p>
    </div>

    <form id="execForm">
      <div class="field-group">
        <label>Select Your Office</label>
        <select id="officeSelect" required>
          <option value="">-- Choose Your Official Office--</option>
          <option value="PRESIDENT">PRESIDENT</option>
          <option value="VICE PRESIDENT 1">VICE PRESIDENT 1</option>
          <option value="VICE-PRESIDENT II">VICE-PRESIDENT II</option>
          <option value="SECRETARY">SECRETARY</option>
          <option value="ASSISTANT SECRETARY">ASSISTANT SECRETARY</option>
          <option value="DIRECTOR OF FINANCE">DIRECTOR OF FINANCE</option>
          <option value="DIRECTOR OF PROGRAMS">DIRECTOR OF PROGRAMS</option>
          <option value="ASSISTANT DIRECTOR OF PROGRAMS">ASSISTANT DIRECTOR OF PROGRAMS</option>
          <option value="DIRECTOR OF MEDIA">DIRECTOR OF MEDIA</option>
          <option value="ASSISTANT DIRECTOR OF MEDIA">ASSISTANT DIRECTOR OF MEDIA</option>
          <option value="DIRECTOR OF ASSETS">DIRECTOR OF ASSETS</option>
          <option value="ASSISTANT DIRECTOR OF ASSETS">ASSISTANT DIRECTOR OF ASSETS</option>
          <option value="DIRECTOR FOR WOMEN AFFAIRS ELECT">DIRECTOR FOR WOMEN AFFAIRS ELECT</option>
          <option value="ASSISTANT DIRECTOR FOR WOMEN AFFAIRS">ASSISTANT DIRECTOR FOR WOMEN AFFAIRS</option>
        </select>
      </div>

      <div class="field-group">
        <label>Confirm Full Name</label>
        <input type="text" id="fullName" readonly required />
        <div class="toggle-container">
          <label class="switch">
            <input type="checkbox" id="editToggle">
            <span class="slider"></span>
          </label>
          <span style="font-size: 0.85rem; color: #555;">Edit if incorrect</span>
        </div>
      </div>

      <button type="submit" class="btn-generate" id="genBtn">GENERATE CERTIFICATE</button>
    </form>
  </div>

  <div id="preview-section">
    <h3 style="margin-bottom: 15px;">Review Certificate</h3>
    <img id="preview-img" src="" alt="Preview">
    <button class="btn-generate" style="background: var(--orange-primary);" id="downloadBtn">DOWNLOAD PDF</button>
  </div>
</main>

<div id="cert-wrapper">
  <div id="cert-capture">
    <img src="background.webp" class="bg-img" alt="BG">
    <div id="r-name" class="render-text"></div>
    <div id="r-office" class="render-text"></div>
    <div id="r-id" class="render-text"></div>
    <img src="sec_sig.png" id="sig-sec" class="sig-img">
    <img src="founder_sig.png" id="sig-founder" class="sig-img">
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs, limit, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD_m5yTOkHCj42f8zzmpNmg7I6dqtc1vNY",
    authDomain: "udufafrica-project.firebaseapp.com",
    projectId: "udufafrica-project",
    storageBucket: "udufafrica-project.firebasestorage.app",
    messagingSenderId: "1070479742500",
    appId: "1:1070479742500:web:3b77676d5592860d44aab1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const officeData = {
    "PRESIDENT": "Comr. Uchenna Christopher",
    "CONTINENTAL PRESIDENT": "COMR. CHRISTOPHER UCHENNA NWOSU",
    "VICE PRESIDENT 1": "Comr. Dr. Ngwuoke Edwin Obioma",
    "VICE-PRESIDENT II": "Comr. Prince. Iheanacho Joshua Chimdindu",
    "SECRETARY": "Comr. Ani Precious Chidimma",
    "ASSISTANT SECRETARY": "Comr. Ezeudo Gloria Odinakachukwu",
    "DIRECTOR OF FINANCE": "Comr. Chira Christiana Chinyere",
    "DIRECTOR OF PROGRAMS": "Comr. Chukwuemelie Miracle Eke",
    "ASSISTANT DIRECTOR OF PROGRAMS": "Comr. Amb. Uzundu Joshua Ikechukwu",
    "DIRECTOR OF MEDIA": "Comr. Owan Erico Itesi",
    "ASSISTANT DIRECTOR OF MEDIA": "Comr. Chukwuemeka Chimaobi Emmanuel",
    "DIRECTOR OF ASSETS": "Comr. Onuigbo Godwin Chidubem",
    "ASSISTANT DIRECTOR OF ASSETS": "Comr. Evang. Ohagwu Valentine Ikenna",
    "DIRECTOR FOR WOMEN AFFAIRS ELECT": "Comr. Okoye Ukamaka Mary",
    "ASSISTANT DIRECTOR FOR WOMEN AFFAIRS": "Comr. Ogbu Grace Chinecherem"
  };

  const officeSelect = document.getElementById('officeSelect');
  const nameInput = document.getElementById('fullName');
  const editToggle = document.getElementById('editToggle');
  let pdfObj = null;

  function adjustFontSize(element, maxFS) {
      let fs = maxFS;
      element.style.fontSize = fs + "px";
      while (element.scrollWidth > element.offsetWidth && fs > 20) {
          fs -= 2;
          element.style.fontSize = fs + "px";
      }
  }

  officeSelect.addEventListener('change', (e) => {
    nameInput.value = officeData[e.target.value] || "";
  });

  editToggle.addEventListener('change', (e) => {
    nameInput.readOnly = !e.target.checked;
    if(e.target.checked) nameInput.focus();
  });

  document.getElementById('execForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('genBtn');
    btn.innerText = "VERIFYING";
    btn.disabled = true;

    try {
      let certId = "";
      
      // Step 1: Check if this name and office has already generated a certificate
      const dupQuery = query(
        collection(db, "executive-certificate"), 
        where("name", "==", nameInput.value),
        where("office", "==", officeSelect.value),
        limit(1)
      );
      const dupSnap = await getDocs(dupQuery);

      if(!dupSnap.empty) {
        // Return existing certificate ID
        certId = dupSnap.docs[0].data().certId;
      } else {
        // Step 2: Generate new certificate using available codes
        const q = query(collection(db, "codes"), where("used", "==", false), limit(1));
        const snap = await getDocs(q);
        if(snap.empty) throw new Error("Verification codes depleted.");

        const codeDoc = snap.docs[0];
        certId = `UDUF-EXEC-${codeDoc.data().code}`;

        // Mark code as used and record new certificate
        await updateDoc(doc(db, "codes", codeDoc.id), { used: true, assignedTo: nameInput.value });
        await addDoc(collection(db, "executive-certificate"), {
          name: nameInput.value,
          office: officeSelect.value,
          certId: certId,
          timestamp: serverTimestamp()
        });
      }

      // Step 3: Draw certificate
      const nameEl = document.getElementById('r-name');
      nameEl.innerText = nameInput.value;
      adjustFontSize(nameEl, 42);

      document.getElementById('r-office').innerText = officeSelect.value;
      document.getElementById('r-id').innerText = `Certificate Id: ${certId}`;

      await new Promise(r => setTimeout(r, 300));

      const canvas = await html2canvas(document.getElementById('cert-capture'), { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/png');
      document.getElementById('preview-img').src = imgData;

      const { jsPDF } = window.jspdf;
      pdfObj = new jsPDF('l', 'px', [1000, 780]);
      pdfObj.addImage(imgData, 'PNG', 0, 0, 1000, 780);

      document.getElementById('preview-section').style.display = "block";
      btn.innerText = "GENERATED";
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.innerText = "GENERATE CERTIFICATE";
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if(pdfObj) pdfObj.save(`UDUF_Exec_${nameInput.value.replace(/\s+/g, '_')}.pdf`);
  });
</script>

</body>
</html>
